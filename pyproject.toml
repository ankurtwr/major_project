[project]
name = "major-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ankurtwr", email = "ankurtwr1979@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.143.0",
    "google-genai>=2.29.0",
    "pandas>=3.0.6",
    "pwdlib[argon2]>=0.3.1",
    "pymysql>=1.2.3",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.6",
    "transformers>=5.19.0",
]

[project.scripts]
major-project = "major_project:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
